services:
  - type: web
    name: kbsc-project
    runtime: python
    buildCommand: >
      npm install &&
      npm run build &&
      pip install -r requirements.txt
    startCommand: >
      gunicorn --pythonpath . backend.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: NODE_ENV
        value: production
